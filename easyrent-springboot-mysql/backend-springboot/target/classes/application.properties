# Server
server.port=${PORT:5000}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:easyrent}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sonu@9630
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Use "update" during development so tables are created automatically.
# Switch to "validate" (with a proper migration tool) once schema is stable.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${SECRET_KEY:change-this-secret-key-in-env}
app.jwt.expire=7d

# Cookies (set true in production so SameSite=None + Secure cookies work over HTTPS)
app.production=${PRODUCTION:false}

# Frontend URL (used for CORS, email links, Stripe redirect URLs)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Mail (SMTP) - fill these in your environment / .env
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@easyrent.local}

# Stripe
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Socket.IO server (separate port; point the frontend's socket.io-client at this)
app.socketio.host=0.0.0.0
app.socketio.port=${SOCKET_PORT:9092}

# File upload limits (if you later add multipart uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
